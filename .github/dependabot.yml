version: 2
# Every entry targets `develop`: `main` moves only by an owner-approved
# fast-forward of a green `develop` (CLAUDE.md). Weekly, at most 5 open PRs per
# entry, minor and patch updates grouped per entry. No auto-merge anywhere;
# every Dependabot PR is reviewed and merged by a human.
updates:
  # Production compose image digests (caddy, mongo, redis)
  - package-ecosystem: "docker-compose"
    directory: "/infrastructure/deploy"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-compose-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/services/academy-service"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
