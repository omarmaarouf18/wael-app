name: CI Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Public repo: CI never needs write access to the repo contents.
permissions:
  contents: read

jobs:
  lint-formatting:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Verify Go Formatting
        run: |
          if [ -n "$(gofmt -l services shared tests tools)" ]; then
            echo "Unformatted files:"
            gofmt -l services shared tests tools
            exit 1
          fi

      - name: Verify Markdown Commit SHAs
        run: |
          FAILED_SHA=0
          for file in $(git ls-files '*.md'); do
            for sha in $(grep -oE "[0-9a-f]{40}" "$file" || true); do
              if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
                echo "BLOCKED: fabricated/non-existent SHA $sha in $file"
                FAILED_SHA=1
              elif ! git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
                echo "BLOCKED: SHA $sha in $file is not reachable from current branch history"
                FAILED_SHA=1
              fi
            done
          done
          if [ "$FAILED_SHA" -eq 1 ]; then
            exit 1
          fi

      - name: Verify Go Version Consistency (Drift Guard)
        run: |
          CANONICAL_GO_VERSION="1.26"
          CANONICAL_GO_PATCH_VERSION="1.26.6"
          CANONICAL_GO_TOOLCHAIN="go1.26.6"
          CANONICAL_GOSEC_VERSION="v2.29.0"
          DRIFT_FAILED=0
          for f in go.work services/*/go.mod shared/infra/go.mod tools/*/go.mod tests/*/go.mod; do
            if [ -f "$f" ]; then
              v=$(grep -E '^go [0-9]+\.[0-9]+' "$f" | head -n 1 | awk '{print $2}')
              if [ "$v" != "$CANONICAL_GO_VERSION" ]; then
                echo "BLOCKED: drift in $f: expected $CANONICAL_GO_VERSION, found '${v:-NONE}'"
                DRIFT_FAILED=1
              fi
              tc=$(grep -E '^toolchain go[0-9]+\.[0-9]+\.[0-9]+' "$f" | head -n 1 | awk '{print $2}')
              if [ "$tc" != "$CANONICAL_GO_TOOLCHAIN" ]; then
                echo "BLOCKED: toolchain drift in $f: expected $CANONICAL_GO_TOOLCHAIN, found '${tc:-NONE}'"
                DRIFT_FAILED=1
              fi
            fi
          done
          for v in $(grep -oE "go-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); do
            if [ "$v" != "$CANONICAL_GO_PATCH_VERSION" ]; then
              echo "BLOCKED: drift in ci.yml: expected $CANONICAL_GO_PATCH_VERSION, found '$v'"
              DRIFT_FAILED=1
            fi
          done
          for d in services/*/Dockerfile; do
            if [ -f "$d" ]; then
              for v in $(grep -oE "FROM golang:[0-9]+\.[0-9]+\.[0-9]+" "$d" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); do
                if [ "$v" != "$CANONICAL_GO_PATCH_VERSION" ]; then
                  echo "BLOCKED: drift in $d: expected $CANONICAL_GO_PATCH_VERSION, found '$v'"
                  DRIFT_FAILED=1
                fi
              done
            fi
          done
          if [ "$DRIFT_FAILED" -eq 1 ]; then
            exit 1
          fi
          HOOK_GOSEC=$(grep -oE 'CANONICAL_GOSEC_VERSION="[v0-9.]+"' .githooks/pre-push | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          CI_GOSEC=$(grep -oE "gosec/v2/cmd/gosec@v[0-9]+\.[0-9]+\.[0-9]+" .github/workflows/ci.yml | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          if [ -z "$HOOK_GOSEC" ] || [ -z "$CI_GOSEC" ] || [ "$HOOK_GOSEC" != "$CI_GOSEC" ] || [ "$CI_GOSEC" != "$CANONICAL_GOSEC_VERSION" ]; then
            echo "BLOCKED: gosec pin mismatch: hook has '${HOOK_GOSEC:-NONE}', ci.yml has '${CI_GOSEC:-NONE}', canonical is '$CANONICAL_GOSEC_VERSION'"
            exit 1
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URI: redis://localhost:6379
      REQUIRE_DB: "1"
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/api-gateway, name: api-gateway }
          - { path: services/auth-service, name: auth-service }
          - { path: services/notification-service, name: notification-service }
          - { path: shared/infra, name: shared-infra }
          - { path: tools/docgen, name: docgen }
          - { path: tests/contracts, name: contracts }
          - { path: tests/e2e, name: e2e }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build
        working-directory: ${{ matrix.service.path }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.service.path }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.service.path }}
        run: go test -race ./... -count=1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/api-gateway, name: api-gateway }
          - { path: services/auth-service, name: auth-service }
          - { path: services/notification-service, name: notification-service }
          - { path: shared/infra, name: shared-infra }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ${{ matrix.service.path }}
          cache: false

      - name: Run gosec
        working-directory: ${{ matrix.service.path }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      # Full history, all refs. Known test-fixture false positives are
      # allowlisted by fingerprint in .gitleaksignore.
      - name: Run gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --log-opts="--all" --redact

  flutter-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Frontend Composition Gate
        run: bash scripts/frontend_composition_gate.sh

      - name: Flutter Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Flutter Test
        working-directory: frontend
        run: flutter test

  e2e-compose:
    name: E2E (compose)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Generate mTLS Certificates
        run: ./infrastructure/certs/generate-certs.sh

      - name: Build Environment File
        run: |
          ENV_FILE="${RUNNER_TEMP}/.env.local"
          cp infrastructure/.env.example "$ENV_FILE"
          sed -i "s|^APP_ENV=.*|APP_ENV=local|" "$ENV_FILE"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^GATEWAY_SECRET=.*|GATEWAY_SECRET=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^INTERNAL_SERVICE_TOKEN=.*|INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^BLOCKLIST_HMAC_KEY=.*|BLOCKLIST_HMAC_KEY=$(openssl rand -hex 32)|" "$ENV_FILE"

      - name: Start Compose Stack
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml up -d --build --wait

      - name: Run E2E Tests
        env:
          E2E_REQUIRED: "1"
          E2E_GATEWAY_URL: "https://localhost:8080"
          E2E_CA_CERT: "${{ github.workspace }}/infrastructure/certs/ca.crt"
        working-directory: tests/e2e
        run: go test -v -count=1 ./...

      - name: Dump Compose Logs on Failure
        if: failure()
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml logs --tail 100

      - name: Teardown Compose Stack
        if: always()
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml down -v

