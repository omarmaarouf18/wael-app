name: CI Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Public repo: CI never needs write access to the repo contents.
permissions:
  contents: read

jobs:
  lint-formatting:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Verify Go Formatting
        run: |
          if [ -n "$(gofmt -l services shared tests tools)" ]; then
            echo "Unformatted files:"
            gofmt -l services shared tests tools
            exit 1
          fi

      - name: Verify Markdown Commit SHAs
        run: |
          FAILED_SHA=0
          for file in $(git ls-files '*.md'); do
            for sha in $(grep -oE "[0-9a-f]{40}" "$file" || true); do
              if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
                echo "BLOCKED: fabricated/non-existent SHA $sha in $file"
                FAILED_SHA=1
              elif ! git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
                echo "BLOCKED: SHA $sha in $file is not reachable from current branch history"
                FAILED_SHA=1
              fi
            done
          done
          if [ "$FAILED_SHA" -eq 1 ]; then
            exit 1
          fi

      - name: Verify Go Version Consistency (Drift Guard)
        run: |
          CANONICAL_GO_VERSION="1.26"
          CANONICAL_GO_PATCH_VERSION="1.26.6"
          CANONICAL_GO_TOOLCHAIN="go1.26.6"
          CANONICAL_GOSEC_VERSION="v2.29.0"
          DRIFT_FAILED=0
          for f in go.work services/*/go.mod shared/infra/go.mod tools/*/go.mod tests/*/go.mod; do
            if [ -f "$f" ]; then
              v=$(grep -E '^go [0-9]+\.[0-9]+' "$f" | head -n 1 | awk '{print $2}')
              if [ "$v" != "$CANONICAL_GO_VERSION" ]; then
                echo "BLOCKED: drift in $f: expected $CANONICAL_GO_VERSION, found '${v:-NONE}'"
                DRIFT_FAILED=1
              fi
              tc=$(grep -E '^toolchain go[0-9]+\.[0-9]+\.[0-9]+' "$f" | head -n 1 | awk '{print $2}')
              if [ "$tc" != "$CANONICAL_GO_TOOLCHAIN" ]; then
                echo "BLOCKED: toolchain drift in $f: expected $CANONICAL_GO_TOOLCHAIN, found '${tc:-NONE}'"
                DRIFT_FAILED=1
              fi
            fi
          done
          # shellcheck disable=SC2013
          for v in $(grep -oE "go-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); do
            if [ "$v" != "$CANONICAL_GO_PATCH_VERSION" ]; then
              echo "BLOCKED: drift in ci.yml: expected $CANONICAL_GO_PATCH_VERSION, found '$v'"
              DRIFT_FAILED=1
            fi
          done
          for d in services/*/Dockerfile; do
            if [ -f "$d" ]; then
              # shellcheck disable=SC2013
              for v in $(grep -oE "FROM golang:[0-9]+\.[0-9]+\.[0-9]+" "$d" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+"); do
                if [ "$v" != "$CANONICAL_GO_PATCH_VERSION" ]; then
                  echo "BLOCKED: drift in $d: expected $CANONICAL_GO_PATCH_VERSION, found '$v'"
                  DRIFT_FAILED=1
                fi
              done
            fi
          done
          if [ "$DRIFT_FAILED" -eq 1 ]; then
            exit 1
          fi
          HOOK_GOSEC=$(grep -oE 'CANONICAL_GOSEC_VERSION="[v0-9.]+"' .githooks/pre-push | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          CI_GOSEC=$(grep -oE "gosec/v2/cmd/gosec@v[0-9]+\.[0-9]+\.[0-9]+" .github/workflows/ci.yml | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          if [ -z "$HOOK_GOSEC" ] || [ -z "$CI_GOSEC" ] || [ "$HOOK_GOSEC" != "$CI_GOSEC" ] || [ "$CI_GOSEC" != "$CANONICAL_GOSEC_VERSION" ]; then
            echo "BLOCKED: gosec pin mismatch: hook has '${HOOK_GOSEC:-NONE}', ci.yml has '${CI_GOSEC:-NONE}', canonical is '$CANONICAL_GOSEC_VERSION'"
            exit 1
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URI: redis://localhost:6379
      REQUIRE_DB: "1"
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/api-gateway, name: api-gateway }
          - { path: services/auth-service, name: auth-service }
          - { path: services/notification-service, name: notification-service }
          - { path: services/academy-service, name: academy-service }
          - { path: services/admin-console, name: admin-console }
          - { path: shared/infra, name: shared-infra }
          - { path: tools/docgen, name: docgen }
          - { path: tests/contracts, name: contracts }
          - { path: tests/e2e, name: e2e }
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build
        working-directory: ${{ matrix.service.path }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.service.path }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.service.path }}
        run: go test -race ./... -count=1

  admin-console-web:
    name: Admin Console Web Tests (node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plain ES modules and node:test: no npm packages, no build step.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run web tests
        working-directory: services/admin-console
        run: node --test web/test/*.test.mjs

  deploy-scripts:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # generate-certs.sh --sign-only must keep the CA and every other
      # certificate untouched (production signs with an offline CA key).
      - name: Certificate script tests
        run: bash scripts/generate_certs_test.sh

      # deploy.sh and rollback.sh tests (last-good compose, orphans, failed-releases)
      - name: Deploy script tests
        run: bash scripts/deploy_scripts_test.sh

      # The pre-push hook gates pushed SHAs in a temp worktree, never the
      # working tree: an untracked failing file must not block a push.
      - name: Pre-push hook tests
        run: bash scripts/pre_push_hook_test.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/api-gateway, name: api-gateway }
          - { path: services/auth-service, name: auth-service }
          - { path: services/notification-service, name: notification-service }
          - { path: services/academy-service, name: academy-service }
          - { path: services/admin-console, name: admin-console }
          - { path: shared/infra, name: shared-infra }
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      # Plain step (not the govulncheck action) so the scan runs with
      # GOWORK=off: under a workspace, go.work can hide a module's own
      # versions and the scan would not see what the module really builds.
      - name: Run govulncheck
        working-directory: ${{ matrix.service.path }}
        env:
          GOWORK: 'off'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec
        working-directory: ${{ matrix.service.path }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      # Full history, all refs. Known test-fixture false positives are
      # allowlisted by fingerprint in .gitleaksignore.
      - name: Run gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --log-opts="--all" --redact

  flutter-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Frontend Composition Gate
        run: bash scripts/frontend_composition_gate.sh

      - name: Frontend Composition Gate Self-Test
        run: bash scripts/frontend_gate_test.sh

      - name: Flutter Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Flutter Test
        working-directory: frontend
        run: flutter test

  e2e-compose:
    name: E2E (compose)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Generate mTLS Certificates
        run: ./infrastructure/certs/generate-certs.sh

      - name: Build Environment File
        run: |
          ENV_FILE="${RUNNER_TEMP}/.env.local"
          cp infrastructure/.env.example "$ENV_FILE"
          sed -i "s|^APP_ENV=.*|APP_ENV=local|" "$ENV_FILE"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^GATEWAY_SECRET=.*|GATEWAY_SECRET=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^INTERNAL_SERVICE_TOKEN=.*|INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)|" "$ENV_FILE"
          sed -i "s|^BLOCKLIST_HMAC_KEY=.*|BLOCKLIST_HMAC_KEY=$(openssl rand -hex 32)|" "$ENV_FILE"

      - name: Start Compose Stack
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml up -d --build --wait

      - name: Run E2E Tests
        env:
          E2E_REQUIRED: "1"
          E2E_GATEWAY_URL: "https://localhost:8080"
          E2E_CA_CERT: "${{ github.workspace }}/infrastructure/certs/ca.crt"
        working-directory: tests/e2e
        run: go test -v -count=1 ./...

      - name: Dump Compose Logs on Failure
        if: failure()
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml logs --tail 100

      - name: Teardown Compose Stack
        if: always()
        run: |
          docker compose --env-file "${RUNNER_TEMP}/.env.local" -f infrastructure/docker-compose.yml down -v


  prod-build:
    name: Prod Image Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - academy-service
          - admin-console
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image
        run: |
          docker buildx build \
            --file services/${{ matrix.service }}/Dockerfile \
            --target prod \
            --tag "wael-${{ matrix.service }}:test" \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Verify auth-service admin CLIs
        if: matrix.service == 'auth-service'
        run: |
          docker run --rm --entrypoint /bin/onboard-admin "wael-${{ matrix.service }}:test" --help 2>&1 | grep "Usage of onboard-admin"
          docker run --rm --entrypoint /bin/revoke-admin "wael-${{ matrix.service }}:test" --help 2>&1 | grep "Usage of revoke-admin"

  deploy-config-check:
    name: Deploy Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate deploy compose config
        run: |
          tmp="$(mktemp -d)"
          sed 's/PASTE_[A-Z_0-9]*/x/g' infrastructure/deploy/env.production.example > "$tmp/env"
          printf 'IMAGE_TAG=%s\n' "0000000000000000000000000000000000000000" >> "$tmp/env"
          WAEL_HOME="$tmp" docker compose --env-file "$tmp/env" -f infrastructure/deploy/docker-compose.yml config --quiet
          rm -rf "$tmp"

      - name: Shellcheck deploy scripts
        run: shellcheck infrastructure/deploy/scripts/*.sh

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml infrastructure/deploy/.github/workflows/deploy.yml

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-formatting
      - build-test
      - admin-console-web
      - deploy-scripts
      - security
      - gitleaks
      - flutter-test
      - e2e-compose
      - prod-build
      - deploy-config-check
    steps:
      - name: Verify all CI Gate jobs succeeded
        run: |
          passed=true
          echo "Evaluating CI Gate jobs:"
          check_job() {
            local job="$1"
            local result="$2"
            echo "  $job: $result"
            if [ "$result" != "success" ]; then
              passed=false
            fi
          }
          check_job "lint-formatting" "${{ needs.lint-formatting.result }}"
          check_job "build-test" "${{ needs.build-test.result }}"
          check_job "admin-console-web" "${{ needs.admin-console-web.result }}"
          check_job "deploy-scripts" "${{ needs.deploy-scripts.result }}"
          check_job "security" "${{ needs.security.result }}"
          check_job "gitleaks" "${{ needs.gitleaks.result }}"
          check_job "flutter-test" "${{ needs.flutter-test.result }}"
          check_job "e2e-compose" "${{ needs.e2e-compose.result }}"
          check_job "prod-build" "${{ needs.prod-build.result }}"
          check_job "deploy-config-check" "${{ needs.deploy-config-check.result }}"
          if [ "$passed" != "true" ]; then
            echo "CI OK gate failed: one or more required jobs did not succeed."
            exit 1
          fi
          echo "CI OK: all required jobs succeeded."
