name: Build and Publish

# Publishes images only after "CI Gate" succeeded for a push to main
# (never in parallel with it: saas-core S-01), then mirrors
# infrastructure/deploy/ into wael-app-deploy with the new IMAGE_TAG.
# Active when the repository variable PUBLISH_ENABLED is "true" (enabled in production).
# Release gate satisfied: "CI Gate" on main runs "E2E (compose)" and "Prod Image Build" (Q1 decision 2026-10-02).
# No workflow_dispatch on purpose: publishing happens only from main.
# Note: workflow_run triggers use the workflow file on the default branch.
on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish GHCR Images
    if: >-
      vars.PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
          - academy-service
          - admin-console
    steps:
      - name: Checkout the commit CI verified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable commit-sha tag only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wael-app-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}

  sync-deploy-repo:
    name: Mirror deploy files to wael-app-deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wael-app at the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: src
          persist-credentials: false

      - name: GitHub App token (wael-app-deploy only)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wael-app-deploy

      - name: Checkout wael-app-deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/wael-app-deploy
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          path: deploy

      - name: Mirror infrastructure/deploy and write release.env
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          rsync -a --delete --exclude '.git/' src/infrastructure/deploy/ deploy/
          printf '# Written by wael-app build-and-publish.yml\nIMAGE_TAG=%s\n' "$HEAD_SHA" > deploy/release.env

      - name: Validate compose renders
        working-directory: deploy
        run: |
          tmp="$(mktemp -d)"
          sed 's/PASTE_[A-Z_0-9]*/x/g' env.production.example > "$tmp/env"
          WAEL_HOME="$tmp" docker compose --env-file "$tmp/env" --env-file release.env -f docker-compose.yml config --quiet

      - name: Commit and push
        working-directory: deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "deploy: release ${HEAD_SHA}"
          git push origin main
