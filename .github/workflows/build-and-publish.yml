name: Build and Publish Docker Images

# DISABLED until image publishing is confirmed. The whole job is gated by
# `if: false`; flip it to run on main only when GHCR publishing is wanted.
# There is intentionally no deploy-repo sync job: wael-app-deploy does not
# exist yet. Secrets to create later (do NOT commit): none yet — GHCR uses
# the built-in GITHUB_TOKEN.
on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build & Publish GHCR Images
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - notification-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wael-app-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
