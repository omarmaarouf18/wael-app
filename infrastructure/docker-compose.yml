# =============================================================================
# wael-app — Local Docker Compose stack
# =============================================================================
# No public domain yet: localhost-only, no reverse proxy. The gateway is the
# only published port; backends are reachable only inside wael-net.
#
# First time:
#   ./infrastructure/certs/generate-certs.sh   # local mTLS certs (untracked)
#   cp infrastructure/.env.example infrastructure/.env.local  # then fill secrets
# Run:
#   docker compose --env-file infrastructure/.env.local -f infrastructure/docker-compose.yml up --build -d
# =============================================================================

services:
  mongo:
    image: mongo:7
    container_name: wael-mongo
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wael-net

  redis:
    image: redis:7-alpine
    container_name: wael-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - wael-net

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: dev
    container_name: wael-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:${API_GATEWAY_PORT}"
    volumes:
      - ../services/api-gateway:/app
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/api-gateway.crt:/app/certs/api-gateway.crt:ro
      - ./certs/api-gateway.key:/app/certs/api-gateway.key:ro
      - ./certs/api-gateway-external.crt:/app/certs/api-gateway-external.crt:ro
      - ./certs/api-gateway-external.key:/app/certs/api-gateway-external.key:ro
      - ../shared/infra:/shared/infra:ro
    environment:
      PORT: ${API_GATEWAY_PORT}
      REDIS_URI: ${REDIS_URI}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      ACADEMY_SERVICE_URL: ${ACADEMY_SERVICE_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      APP_ENV: ${APP_ENV}
      APP_DOMAIN: ${APP_DOMAIN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      TLS_CERT_PATH: /app/certs/api-gateway.crt
      TLS_KEY_PATH: /app/certs/api-gateway.key
      TLS_CA_PATH: /app/certs/ca.crt
      EXTERNAL_TLS_CERT_PATH: /app/certs/api-gateway-external.crt
      EXTERNAL_TLS_KEY_PATH: /app/certs/api-gateway-external.key
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://localhost:${API_GATEWAY_PORT}/health || wget -q -O /dev/null http://localhost:${API_GATEWAY_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - wael-net

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
      target: dev
    container_name: wael-auth-service
    restart: unless-stopped
    expose:
      - "${AUTH_SERVICE_PORT}"
    volumes:
      - ../services/auth-service:/app
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/auth-service.crt:/app/certs/auth-service.crt:ro
      - ./certs/auth-service.key:/app/certs/auth-service.key:ro
      - ../shared/infra:/shared/infra:ro
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      AUTH_MONGO_DATABASE: ${AUTH_MONGO_DATABASE}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TLS_CERT_PATH: /app/certs/auth-service.crt
      TLS_KEY_PATH: /app/certs/auth-service.key
      TLS_CA_PATH: /app/certs/ca.crt
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      BLOCKLIST_HMAC_KEY: ${BLOCKLIST_HMAC_KEY}
      DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-EG}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      ADMIN_LISTEN_ADDR: ":9001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # auth-service enforces mTLS (client cert required), so the probe presents one.
      test: ["CMD-SHELL", "curl -sf --cert /app/certs/auth-service.crt --key /app/certs/auth-service.key --cacert /app/certs/ca.crt https://localhost:${AUTH_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - wael-net

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
      target: dev
    container_name: wael-notification-service
    restart: unless-stopped
    expose:
      - "${NOTIFICATION_SERVICE_PORT}"
    volumes:
      - ../services/notification-service:/app
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/notification-service.crt:/app/certs/notification-service.crt:ro
      - ./certs/notification-service.key:/app/certs/notification-service.key:ro
      - ../shared/infra:/shared/infra:ro
    environment:
      PORT: ${NOTIFICATION_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      REDIS_URI: ${REDIS_URI}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TLS_CERT_PATH: /app/certs/notification-service.crt
      TLS_KEY_PATH: /app/certs/notification-service.key
      TLS_CA_PATH: /app/certs/ca.crt
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # notification-service enforces mTLS (client cert required), so the probe presents one.
      test: ["CMD-SHELL", "curl -sf --cert /app/certs/notification-service.crt --key /app/certs/notification-service.key --cacert /app/certs/ca.crt https://localhost:${NOTIFICATION_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - wael-net

  academy-service:
    build:
      context: ../services/academy-service
      dockerfile: Dockerfile
      target: dev
    container_name: wael-academy-service
    restart: unless-stopped
    expose:
      - "${ACADEMY_SERVICE_PORT}"
    volumes:
      - ../services/academy-service:/app
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/academy-service.crt:/app/certs/academy-service.crt:ro
      - ./certs/academy-service.key:/app/certs/academy-service.key:ro
      - ../shared/infra:/shared/infra:ro
      - academy_files:/data/files
    environment:
      PORT: ${ACADEMY_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI}
      ACADEMY_MONGO_DATABASE: ${ACADEMY_MONGO_DATABASE}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      REDIS_URI: ${REDIS_URI}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_ADMIN_URL: https://auth-service:9001
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-https://notification-service:3004}
      EXPOSE_PRICE_TO_STUDENTS: ${EXPOSE_PRICE_TO_STUDENTS:-false}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-+201000000000}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      MIN_VERSION: ${MIN_VERSION:-}
      LATEST_VERSION: ${LATEST_VERSION:-}
      UPDATE_URL: ${UPDATE_URL:-}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-120}
      RATE_LIMIT_PLAY: ${RATE_LIMIT_PLAY:-60}
      RATE_LIMIT_DOWNLOAD: ${RATE_LIMIT_DOWNLOAD:-10}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-5}
      TLS_CERT_PATH: /app/certs/academy-service.crt
      TLS_KEY_PATH: /app/certs/academy-service.key
      TLS_CA_PATH: /app/certs/ca.crt
      ADMIN_LISTEN_ADDR: ":9002"
      # Uploaded PDFs (Phase 5) live in the academy_files volume. An empty
      # DOCUMENT_ENCRYPTION_KEY means an ephemeral key (APP_ENV=local|test
      # only): files uploaded before a restart can no longer be opened.
      STORAGE_DIR: /data/files
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-}
      FEATURES_FILES: ${FEATURES_FILES:-false}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # academy-service enforces mTLS (client cert required), so the probe presents one.
      test: ["CMD-SHELL", "curl -sf --cert /app/certs/academy-service.crt --key /app/certs/academy-service.key --cacert /app/certs/ca.crt https://localhost:${ACADEMY_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - wael-net

  admin-console:
    build:
      context: ../services/admin-console
      dockerfile: Dockerfile
      target: dev
    container_name: wael-admin-console
    restart: unless-stopped
    # No published port (ADR-0008): in production it is reached only through
    # Caddy on admin.<domain>. For a local look, add a temporary override that
    # publishes it on 127.0.0.1.
    expose:
      - "${ADMIN_CONSOLE_PORT:-3005}"
    volumes:
      - ../services/admin-console:/app
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/admin-console.crt:/app/certs/admin-console.crt:ro
      - ./certs/admin-console.key:/app/certs/admin-console.key:ro
      - ../shared/infra:/shared/infra:ro
    environment:
      PORT: ${ADMIN_CONSOLE_PORT:-3005}
      APP_ENV: ${APP_ENV}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # The admin listeners are internal only; the console calls them over mTLS.
      AUTH_ADMIN_URL: https://auth-service:9001
      ACADEMY_ADMIN_URL: https://academy-service:9002
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-}
      TLS_CERT_PATH: /app/certs/admin-console.crt
      TLS_KEY_PATH: /app/certs/admin-console.key
      TLS_CA_PATH: /app/certs/ca.crt
    healthcheck:
      # The console serves HTTPS; the probe verifies the local CA.
      test: ["CMD-SHELL", "curl -sf --cacert /app/certs/ca.crt https://localhost:${ADMIN_CONSOLE_PORT:-3005}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - wael-net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  academy_files:
    driver: local

networks:
  wael-net:
    driver: bridge
