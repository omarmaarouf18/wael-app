name: Deploy

# Runs on the production host's self-hosted runner (pull-only: the runner
# polls GitHub; the host opens no inbound port and GitHub holds no SSH key).
# Active when the repository variable DEPLOY_ENABLED is set to "true" (enabled in production).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, wael-vm]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Deploy (pre-flight, health-gated up, rollback on failure)
        env:
          WAEL_HOME: ${{ vars.WAEL_HOME || '/home/deploybot/wael' }}
        run: ./scripts/deploy.sh
