name: Deploy

# Runs on the production host's self-hosted runner (pull-only: the runner
# polls GitHub; the host opens no inbound port and GitHub holds no SSH key).
# Active when the repository variable DEPLOY_ENABLED is set to "true" (enabled in production).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_failed_release:
        description: 'Force deploy even if this commit was previously rolled back (ALLOW_FAILED_RELEASE=1)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, wael-vm]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy (pre-flight, health-gated up, rollback on failure)
        env:
          WAEL_HOME: ${{ vars.WAEL_HOME || '/home/deploybot/wael' }}
          ALLOW_FAILED_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_failed_release) && '1' || '0' }}
        run: ./scripts/deploy.sh
