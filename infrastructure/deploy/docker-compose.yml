# =============================================================================
# wael-app — production stack (deploy repo)
# =============================================================================
# Source of truth: wael-app/infrastructure/deploy/. The publish workflow
# mirrors that folder into wael-app-deploy and writes release.env
# (IMAGE_TAG=<40-char commit sha>). Do not edit this file in the deploy repo;
# the next sync overwrites it.
#
# Run only through scripts/deploy.sh, which passes:
#   --env-file $WAEL_HOME/.env.production --env-file release.env
#
# Host layout ($WAEL_HOME, default /home/deploybot/wael): see RUNBOOK.md.
# admin-console (SPEC Phase 6.1) is reached only through Caddy on ADMIN_DOMAIN.
# It and the admin listeners of auth-service (:9001) and academy-service
# (:9002) are bound inside their containers and never published.
# =============================================================================

name: wael

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  restart: unless-stopped
  logging: *logging
  networks:
    - wael-net
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WAEL_HOME:?WAEL_HOME is required}/certs/ca.crt:/certs/ca.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      wael-net:
        # Fixed address: the gateway trusts X-Forwarded-For only from here.
        ipv4_address: 172.30.0.10

  api-gateway:
    <<: *app
    image: ghcr.io/omarmaarouf18/wael-app-api-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "8080"
    environment:
      APP_ENV: production
      # Go runtime heap cap (~85% of the container mem_limit, overridable).
      # Unknown env vars are ignored by config.Load(), so this needs no code.
      GOMEMLIMIT: ${GATEWAY_GOMEMLIMIT:-108MiB}
      PORT: "8080"
      APP_DOMAIN: ${API_DOMAIN}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
      REDIS_URI: ${REDIS_URI:?REDIS_URI is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}
      AUTH_SERVICE_URL: https://auth-service:3002
      NOTIFICATION_SERVICE_URL: https://notification-service:3004
      # Must be https: the gateway refuses an http target when mTLS is active.
      ACADEMY_SERVICE_URL: https://academy-service:3003
      TRUSTED_PROXY_IPS: 172.30.0.10
      TLS_CERT_PATH: /app/certs/api-gateway.crt
      TLS_KEY_PATH: /app/certs/api-gateway.key
      TLS_CA_PATH: /app/certs/ca.crt
    volumes:
      - ${WAEL_HOME}/certs/ca.crt:/app/certs/ca.crt:ro
      - ${WAEL_HOME}/certs/api-gateway.crt:/app/certs/api-gateway.crt:ro
      - ${WAEL_HOME}/certs/api-gateway.key:/app/certs/api-gateway.key:ro
    mem_limit: ${GATEWAY_MEM_LIMIT:-128m}
    healthcheck:
      # Strict: verifies the local CA, no -k, no HTTP fallback (W-08).
      test: ["CMD-SHELL", "curl -fsS --cacert /app/certs/ca.crt https://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  auth-service:
    <<: *app
    image: ghcr.io/omarmaarouf18/wael-app-auth-service:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "3002"
    environment:
      APP_ENV: production
      # Go runtime heap cap (~85% of the container mem_limit, overridable).
      GOMEMLIMIT: ${AUTH_GOMEMLIMIT:-160MiB}
      PORT: "3002"
      MONGO_URI: ${AUTH_MONGO_URI:?AUTH_MONGO_URI is required}
      AUTH_MONGO_DATABASE: auth_db
      REDIS_URI: ${REDIS_URI}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      NOTIFICATION_SERVICE_URL: https://notification-service:3004
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      BLOCKLIST_HMAC_KEY: ${BLOCKLIST_HMAC_KEY:?BLOCKLIST_HMAC_KEY is required}
      DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-EG}
      # Admin listener: internal only, not published (ADR-0008).
      ADMIN_LISTEN_ADDR: ":9001"
      TLS_CERT_PATH: /app/certs/auth-service.crt
      TLS_KEY_PATH: /app/certs/auth-service.key
      TLS_CA_PATH: /app/certs/ca.crt
    volumes:
      - ${WAEL_HOME}/certs/ca.crt:/app/certs/ca.crt:ro
      - ${WAEL_HOME}/certs/auth-service.crt:/app/certs/auth-service.crt:ro
      - ${WAEL_HOME}/certs/auth-service.key:/app/certs/auth-service.key:ro
    mem_limit: ${AUTH_MEM_LIMIT:-192m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /app/certs/ca.crt --cert /app/certs/auth-service.crt --key /app/certs/auth-service.key https://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  notification-service:
    <<: *app
    image: ghcr.io/omarmaarouf18/wael-app-notification-service:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "3004"
    environment:
      APP_ENV: production
      # Go runtime heap cap (~85% of the container mem_limit, overridable).
      GOMEMLIMIT: ${NOTIFICATION_GOMEMLIMIT:-160MiB}
      PORT: "3004"
      MONGO_URI: ${NOTIFICATION_MONGO_URI:?NOTIFICATION_MONGO_URI is required}
      NOTIFICATION_MONGO_DATABASE: notification_db
      REDIS_URI: ${REDIS_URI}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Optional; empty means the service default (3 and 10).
      STREAM_MAX_CONCURRENT: ${STREAM_MAX_CONCURRENT:-}
      STREAM_OPEN_RATE_LIMIT: ${STREAM_OPEN_RATE_LIMIT:-}
      TLS_CERT_PATH: /app/certs/notification-service.crt
      TLS_KEY_PATH: /app/certs/notification-service.key
      TLS_CA_PATH: /app/certs/ca.crt
    volumes:
      - ${WAEL_HOME}/certs/ca.crt:/app/certs/ca.crt:ro
      - ${WAEL_HOME}/certs/notification-service.crt:/app/certs/notification-service.crt:ro
      - ${WAEL_HOME}/certs/notification-service.key:/app/certs/notification-service.key:ro
    mem_limit: ${NOTIFICATION_MEM_LIMIT:-192m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /app/certs/ca.crt --cert /app/certs/notification-service.crt --key /app/certs/notification-service.key https://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  academy-service:
    <<: *app
    image: ghcr.io/omarmaarouf18/wael-app-academy-service:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "3003"
    environment:
      APP_ENV: production
      # Go runtime heap cap (~85% of the container mem_limit, overridable).
      GOMEMLIMIT: ${ACADEMY_GOMEMLIMIT:-160MiB}
      PORT: "3003"
      MONGO_URI: ${ACADEMY_MONGO_URI:?ACADEMY_MONGO_URI is required}
      ACADEMY_MONGO_DATABASE: academy_db
      REDIS_URI: ${REDIS_URI}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AUTH_SERVICE_URL: https://auth-service:3002
      AUTH_ADMIN_URL: https://auth-service:9001
      NOTIFICATION_SERVICE_URL: https://notification-service:3004
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:?SUPPORT_WHATSAPP is required}
      # Public app config (F-UX2 A7): terms/privacy pages and update metadata.
      TERMS_URL: ${TERMS_URL:?TERMS_URL is required}
      PRIVACY_URL: ${PRIVACY_URL:?PRIVACY_URL is required}
      MIN_VERSION: ${MIN_VERSION:-}
      LATEST_VERSION: ${LATEST_VERSION:-}
      UPDATE_URL: ${UPDATE_URL:-}
      # Prices stay hidden from students unless this is "true" (SPEC D3).
      EXPOSE_PRICE_TO_STUDENTS: ${EXPOSE_PRICE_TO_STUDENTS:-false}
      # Optional per-minute tier limits; empty means the service default.
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-}
      RATE_LIMIT_PLAY: ${RATE_LIMIT_PLAY:-}
      RATE_LIMIT_DOWNLOAD: ${RATE_LIMIT_DOWNLOAD:-}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-}
      # Admin listener: internal only, not published (ADR-0008).
      ADMIN_LISTEN_ADDR: ":9002"
      TLS_CERT_PATH: /app/certs/academy-service.crt
      TLS_KEY_PATH: /app/certs/academy-service.key
      TLS_CA_PATH: /app/certs/ca.crt
    volumes:
      - ${WAEL_HOME}/certs/ca.crt:/app/certs/ca.crt:ro
      - ${WAEL_HOME}/certs/academy-service.crt:/app/certs/academy-service.crt:ro
      - ${WAEL_HOME}/certs/academy-service.key:/app/certs/academy-service.key:ro
    mem_limit: ${ACADEMY_MEM_LIMIT:-192m}
    healthcheck:
      # Strict mTLS: the service requires a client certificate, and the probe
      # verifies the local CA. No -k, no HTTP fallback (W-08).
      test: ["CMD-SHELL", "curl -fsS --cacert /app/certs/ca.crt --cert /app/certs/academy-service.crt --key /app/certs/academy-service.key https://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  admin-console:
    # Not <<: *app: the console talks only to the auth and academy admin
    # listeners, so it does not wait for (or depend on) mongo and redis.
    restart: unless-stopped
    logging: *logging
    networks:
      - wael-net
    image: ghcr.io/omarmaarouf18/wael-app-admin-console:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "3005"
    environment:
      APP_ENV: production
      # Go runtime heap cap (~85% of the container mem_limit, overridable).
      GOMEMLIMIT: ${ADMIN_GOMEMLIMIT:-54MiB}
      PORT: "3005"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      # Admin listeners: internal only, called over mTLS (ADR-0008).
      AUTH_ADMIN_URL: https://auth-service:9001
      ACADEMY_ADMIN_URL: https://academy-service:9002
      # The console believes X-Forwarded-For only from Caddy's fixed address.
      TRUSTED_PROXY_IPS: 172.30.0.10
      TLS_CERT_PATH: /app/certs/admin-console.crt
      TLS_KEY_PATH: /app/certs/admin-console.key
      TLS_CA_PATH: /app/certs/ca.crt
    volumes:
      - ${WAEL_HOME}/certs/ca.crt:/app/certs/ca.crt:ro
      - ${WAEL_HOME}/certs/admin-console.crt:/app/certs/admin-console.crt:ro
      - ${WAEL_HOME}/certs/admin-console.key:/app/certs/admin-console.key:ro
    mem_limit: ${ADMIN_MEM_LIMIT:-64m}
    healthcheck:
      # Strict: verifies the local CA, no -k, no HTTP fallback (W-08).
      test: ["CMD-SHELL", "curl -fsS --cacert /app/certs/ca.crt https://localhost:3005/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mongo:
    image: mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b  # mongod 7.0.43 (prod 2026-10-02)
    restart: unless-stopped
    logging: *logging
    # No published port: reachable only inside wael-net.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      # Read from a file, not an env var, so it is not in `docker inspect`.
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
    volumes:
      - mongo_data:/data/db
    mem_limit: ${MONGO_MEM_LIMIT:-768m}
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      # ping needs no authentication.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - wael-net

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *logging
    # Password lives in redis.conf (requirepass), never on the command line (W-09).
    # Memory cap is passed as CLI args (not in secrets/redis.conf, which lives
    # only on the server): CLI args after the config file override it, so a
    # normal deploy picks this up with no manual server step. The cap sits
    # below REDIS_MEM_LIMIT (128m) to leave headroom for AOF-rewrite fork
    # copy-on-write and client buffers (appendonly yes is on).
    # Policy MUST stay noeviction: any eviction policy could drop denylist
    # keys (jti/sid/user revocation) and revive revoked tokens. At the limit
    # writes fail with OOM errors (new logins/refresh/OTP fail) while reads
    # keep working — degraded, not dead, and fail-closed.
    command: ["redis-server", "/run/secrets/redis_conf", "--maxmemory", "${REDIS_MAXMEMORY:-96mb}", "--maxmemory-policy", "noeviction"]
    secrets:
      - redis_conf
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/secrets/redis_conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - wael-net

secrets:
  mongo_root_password:
    file: ${WAEL_HOME}/secrets/mongo_root_password
  redis_conf:
    file: ${WAEL_HOME}/secrets/redis.conf

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  wael-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
