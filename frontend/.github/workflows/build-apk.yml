name: Build Android

# Lives in wael-app/frontend/.github/ and runs only in wael-app-mobile
# (the subtree mirror), where this folder is the repository root.
# - API_BASE_URL (repo variable) is required: a release build without it
#   would point at the emulator host (lib/core/app_config.dart).
# - With the four ANDROID_* signing secrets: builds a signed APK + AAB and
#   creates a GitHub Release. Without them: builds a debug-signed APK as a
#   workflow artifact only, clearly labelled not for distribution.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Require API_BASE_URL (https)
        run: |
          case "$API_BASE_URL" in
            https://*) echo "API_BASE_URL=$API_BASE_URL" ;;
            *) echo "::error::Set repository variable API_BASE_URL to the https production URL"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (same pin as wael-app CI)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Dependencies
        run: flutter pub get

      - name: Write signing config
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build release App Bundle (signed builds only)
        if: env.HAS_SIGNING == 'true'
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Version
        id: v
        run: |
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (debug-signed, NOT for distribution)
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wael-app-${{ steps.v.outputs.version }}-${{ steps.v.outputs.short }}-DEBUG-SIGNED-not-for-distribution
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Release (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}-${{ steps.v.outputs.short }}
        run: |
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "wael-app $TAG" \
            --notes "Signed build of commit ${{ steps.v.outputs.short }}. API: $API_BASE_URL"
