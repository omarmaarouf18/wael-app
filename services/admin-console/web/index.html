<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>لوحة إدارة EL METR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Sign-in: the admin token is the only credential. It is kept in memory
       (js/auth.js) and never stored. -->
  <main id="login-view" class="login">
    <form id="login-form" class="card login-card" novalidate>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name" data-i18n="app.brand">EL METR</p>
          <h1 data-i18n="login.title">تسجيل دخول المشرف</h1>
        </div>
      </div>
      <p class="muted" data-i18n="login.subtitle"></p>
      <label for="login-token" data-i18n="login.token"></label>
      <input id="login-token" class="ltr" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <div id="login-banner" class="banner" role="alert" hidden></div>
      <button id="login-submit" class="btn primary" type="submit" data-i18n="login.submit"></button>
      <p class="muted small" data-i18n="login.hint"></p>
      <button id="login-lang" class="btn link" type="button" data-i18n="top.language"></button>
    </form>
  </main>

  <div id="app-view" class="shell" data-nav="closed" hidden>
    <!-- Narrow screens (< 900px): a top bar whose menu button opens the side
         navigation as a drawer. Hidden by the stylesheet on wide screens. -->
    <header class="mobilebar">
      <button id="nav-open" class="icon-btn" type="button" aria-controls="sidenav" aria-expanded="false" data-i18n-aria-label="nav.open"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <p class="brand-name" data-i18n="app.brand">EL METR</p>
      </div>
    </header>
    <div id="nav-scrim" class="nav-scrim" hidden></div>

    <!-- Side navigation: on the right in Arabic (right-to-left), on the left in
         English. Same tab ids and order as before, Overview first. -->
    <aside id="sidenav" class="sidenav" data-i18n-aria-label="tabs.label">
      <div class="sidenav-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name" data-i18n="app.brand">EL METR</p>
            <p class="muted small" data-i18n="app.subtitle"></p>
          </div>
        </div>
        <button id="nav-close" class="icon-btn nav-close" type="button" data-i18n-aria-label="nav.close"><svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <nav id="tabs" class="tabs" role="tablist" aria-orientation="vertical" data-i18n-aria-label="tabs.label">
        <button id="tab-overview" class="tab" type="button" role="tab" aria-controls="panel-overview" aria-selected="true" data-tab="overview"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="tab-label" data-i18n="tabs.overview"></span></button>
        <button id="tab-accounts" class="tab" type="button" role="tab" aria-controls="panel-accounts" aria-selected="false" tabindex="-1" data-tab="accounts"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11a3 3 0 1 0 0-6"/></svg><span class="tab-label" data-i18n="tabs.accounts"></span></button>
        <button id="tab-audit" class="tab" type="button" role="tab" aria-controls="panel-audit" aria-selected="false" tabindex="-1" data-tab="audit"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tab-label" data-i18n="tabs.audit"></span></button>
        <button id="tab-requests" class="tab" type="button" role="tab" aria-controls="panel-requests" aria-selected="false" tabindex="-1" data-tab="requests"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5l-1 4z"/></svg><span class="tab-label" data-i18n="tabs.requests"></span> <span id="badge-requests" class="count" hidden></span></button>
        <button id="tab-catalog" class="tab" type="button" role="tab" aria-controls="panel-catalog" aria-selected="false" tabindex="-1" data-tab="catalog"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6"/></svg><span class="tab-label" data-i18n="tabs.catalog"></span></button>
        <button id="tab-iap" class="tab" type="button" role="tab" aria-controls="panel-iap" aria-selected="false" tabindex="-1" data-tab="iap"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg><span class="tab-label" data-i18n="tabs.iap"></span></button>
        <button id="tab-settings" class="tab" type="button" role="tab" aria-controls="panel-settings" aria-selected="false" tabindex="-1" data-tab="settings"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg><span class="tab-label" data-i18n="tabs.settings"></span></button>
        <button id="tab-files" class="tab" type="button" role="tab" aria-controls="panel-files" aria-selected="false" tabindex="-1" data-tab="files"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg><span class="tab-label" data-i18n="tabs.files"></span></button>
        <button id="tab-notifications" class="tab" type="button" role="tab" aria-controls="panel-notifications" aria-selected="false" tabindex="-1" data-tab="notifications"><svg class="tab-icon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="tab-label" data-i18n="tabs.notifications"></span></button>
      </nav>
      <div class="nav-user">
        <span id="admin-initial" class="avatar avatar-sm" aria-hidden="true"></span>
        <p class="who"><span class="visually-hidden" data-i18n="top.signedInAs"></span> <strong id="admin-name"></strong> <span class="muted small" data-i18n="top.role"></span></p>
        <div class="nav-user-actions">
          <button id="lang-toggle" class="btn secondary small" type="button" data-i18n="top.language"></button>
          <button id="sign-out" class="btn secondary small" type="button" data-i18n="top.signOut"></button>
        </div>
      </div>
    </aside>

    <main id="main" class="main">
    <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
      <div class="section-head">
        <div>
          <h2 id="overview-greeting"></h2>
          <p id="overview-date" class="muted small"></p>
        </div>
      </div>
      <div id="overview-banner" class="banner" role="alert" hidden></div>
      <div id="overview-body" class="overview"></div>
    </section>

    <section id="panel-accounts" role="tabpanel" aria-labelledby="tab-accounts" hidden>
      <div class="section-head">
        <div>
          <h2 data-i18n="accounts.title"></h2>
          <p id="accounts-count" class="muted small" aria-live="polite"></p>
        </div>
      </div>
      <form id="accounts-filter" class="toolbar" role="search">
        <div class="field grow">
          <label for="accounts-search" data-i18n="accounts.searchLabel"></label>
          <input id="accounts-search" type="search" maxlength="100" autocomplete="off" data-i18n-placeholder="accounts.search">
        </div>
        <div class="field">
          <span id="accounts-status-label" class="field-label" data-i18n="accounts.statusLabel"></span>
          <div id="accounts-status" class="segment" role="group" aria-labelledby="accounts-status-label"></div>
        </div>
        <button class="btn primary" type="submit" data-i18n="accounts.filter"></button>
        <button id="accounts-reset" class="btn secondary" type="button" data-i18n="accounts.reset"></button>
      </form>
      <div id="accounts-banner" class="banner" role="alert" hidden></div>
      <div id="students-layout" class="students-layout" data-panel="closed">
        <div class="students-main">
          <ul id="accounts-list" class="student-list" aria-live="polite"></ul>
          <div id="accounts-pager" class="pager">
            <span class="muted" data-role="total"></span>
            <div class="pager-controls">
              <button class="btn secondary small" type="button" data-role="prev" data-i18n="common.prev"></button>
              <span data-role="info"></span>
              <button class="btn secondary small" type="button" data-role="next" data-i18n="common.next"></button>
            </div>
          </div>
        </div>
        <!-- Student side panel: beside the list on wide screens, a full-screen
             drawer below 900px. Filled by js/accounts.js. -->
        <aside id="student-panel" class="student-panel" aria-labelledby="student-panel-name" hidden>
          <button id="student-panel-close" class="icon-btn sp-close" type="button" data-i18n-aria-label="common.close"><svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <div id="student-panel-body"></div>
        </aside>
      </div>
    </section>

    <section id="panel-audit" role="tabpanel" aria-labelledby="tab-audit" hidden>
      <div class="section-head">
        <div>
          <h2 data-i18n="audit.title"></h2>
          <p class="muted small" data-i18n="audit.hint"></p>
        </div>
        <div class="section-actions">
          <div id="audit-source" class="segment" role="group" data-i18n-aria-label="audit.sourceLabel">
            <button id="audit-source-academy" class="btn small secondary" type="button" data-i18n="audit.source.academy" aria-pressed="true"></button>
            <button id="audit-source-student" class="btn small secondary" type="button" data-i18n="audit.source.student" aria-pressed="false"></button>
            <button id="audit-source-auth" class="btn small secondary" type="button" data-i18n="audit.source.auth" aria-pressed="false"></button>
            <button id="audit-source-notifications" class="btn small secondary" type="button" data-i18n="audit.source.notifications" aria-pressed="false"></button>
          </div>
          <button id="audit-refresh" class="btn secondary" type="button" data-i18n="common.refresh"></button>
        </div>
      </div>
      <form id="audit-filter" class="toolbar" role="search">
        <div class="field">
          <label for="audit-search" data-i18n="audit.search"></label>
          <input id="audit-search" type="search" data-i18n-placeholder="audit.searchPlaceholder" autocomplete="off" />
        </div>
        <div class="field">
          <label for="audit-action" data-i18n="audit.filterAction"></label>
          <select id="audit-action"></select>
        </div>
        <button id="audit-filter-submit" class="btn primary" type="submit" data-i18n="audit.filter"></button>
        <button id="audit-filter-reset" class="btn secondary" type="button" data-i18n="audit.reset"></button>
        <p id="audit-filter-note" class="muted small audit-filter-note" aria-live="polite"></p>
      </form>
      <div id="audit-banner" class="banner" role="alert" hidden></div>
      <div id="audit-list" class="audit-list" aria-live="polite"></div>
      <div id="audit-pager" class="pager">
        <span class="muted" data-role="total"></span>
        <div class="pager-controls">
          <button class="btn secondary small" type="button" data-role="prev" data-i18n="common.prev"></button>
          <span data-role="info"></span>
          <button class="btn secondary small" type="button" data-role="next" data-i18n="common.next"></button>
        </div>
      </div>
    </section>

    <section id="panel-requests" role="tabpanel" aria-labelledby="tab-requests" hidden>
      <h2 data-i18n="requests.title"></h2>
      <form id="requests-filter" class="toolbar">
        <div class="field">
          <label for="requests-view-mode" data-i18n="requests.viewMode"></label>
          <select id="requests-view-mode">
            <option value="grouped" data-i18n="requests.view.grouped" selected></option>
            <option value="flat" data-i18n="requests.view.flat"></option>
          </select>
        </div>
        <div class="field">
          <label for="requests-status" data-i18n="requests.filterStatus"></label>
          <select id="requests-status">
            <option value="pending" data-i18n="requests.status.pending" selected></option>
            <option value="accepted" data-i18n="requests.status.accepted"></option>
            <option value="rejected" data-i18n="requests.status.rejected"></option>
            <option value="" data-i18n="requests.statusAll"></option>
          </select>
        </div>
        <div class="field">
          <label for="requests-source" data-i18n="requests.filterSource"></label>
          <select id="requests-source">
            <option value="" data-i18n="requests.sourceAll" selected></option>
            <option value="web" data-i18n="requests.source.web"></option>
            <option value="mobile" data-i18n="requests.source.mobile"></option>
          </select>
        </div>
        <div class="field">
          <label for="requests-subject" data-i18n="requests.filterSubject"></label>
          <select id="requests-subject">
            <option value="" data-i18n="requests.filterAllSubjects"></option>
          </select>
        </div>
        <div class="field grow">
          <label for="requests-search" data-i18n="accounts.search"></label>
          <input id="requests-search" type="search" data-i18n-placeholder="requests.searchPlaceholder">
        </div>
        <button class="btn primary" type="submit" data-i18n="accounts.filter"></button>
        <button id="requests-reset" class="btn secondary" type="button" data-i18n="accounts.reset"></button>
      </form>
      <div id="requests-bulk-bar" class="toolbar bulk-bar" hidden>
        <span id="requests-bulk-info" class="strong"></span>
        <div class="bulk-actions">
          <button id="requests-bulk-accept-btn" class="btn small primary" type="button" data-i18n="requests.bulk.accept"></button>
          <button id="requests-bulk-reject-btn" class="btn small danger-outline" type="button" data-i18n="requests.bulk.reject"></button>
          <button id="requests-bulk-clear-btn" class="btn small secondary" type="button" data-i18n="requests.bulk.clear"></button>
        </div>
      </div>
      <div id="requests-banner" class="banner" role="alert" hidden></div>
      <div class="table-wrap">
        <table id="requests-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="requests.col.student"></th>
              <th scope="col" data-i18n="requests.col.phone"></th>
              <th scope="col" data-i18n="requests.col.email"></th>
              <th scope="col" data-i18n="requests.col.subject"></th>
              <th scope="col" data-i18n="requests.col.source"></th>
              <th scope="col" data-i18n="requests.col.paymentDetails"></th>
              <th scope="col" data-i18n="requests.col.price"></th>
              <th scope="col" data-i18n="requests.col.requested"></th>
              <th scope="col" data-i18n="requests.col.status"></th>
              <th scope="col" data-i18n="requests.col.actions"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="requests-pager" class="pager">
        <span class="muted" data-role="total"></span>
        <div class="pager-controls">
          <button class="btn secondary small" type="button" data-role="prev" data-i18n="common.prev"></button>
          <span data-role="info"></span>
          <button class="btn secondary small" type="button" data-role="next" data-i18n="common.next"></button>
        </div>
      </div>
    </section>
    <section id="panel-catalog" role="tabpanel" aria-labelledby="tab-catalog" hidden>
      <h2 data-i18n="catalog.title"></h2>
      <nav id="catalog-crumb" class="crumb" aria-label="breadcrumb"></nav>
      <div id="catalog-toolbar" class="toolbar"></div>
      <div id="catalog-banner" class="banner" role="alert" hidden></div>
      <div id="catalog-content"></div>
      <div id="catalog-pager" class="pager">
        <span class="muted" data-role="total"></span>
        <div class="pager-controls">
          <button class="btn secondary small" type="button" data-role="prev" data-i18n="common.prev"></button>
          <span data-role="info"></span>
          <button class="btn secondary small" type="button" data-role="next" data-i18n="common.next"></button>
        </div>
      </div>
    </section>
    <section id="panel-iap" role="tabpanel" aria-labelledby="tab-iap" hidden>
      <div class="section-head">
        <div>
          <h2 data-i18n="iap.title"></h2>
          <p class="muted small" data-i18n="iap.subtitle"></p>
        </div>
        <div class="section-actions">
          <button id="iap-add" class="btn primary" type="button" data-i18n="iap.add"></button>
        </div>
      </div>
      <p id="iap-coverage" class="callout" hidden></p>
      <div id="iap-banner" class="banner" role="alert" hidden></div>
      <div class="table-wrap">
        <table id="iap-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="iap.col.title"></th>
              <th scope="col" data-i18n="iap.col.productId"></th>
              <th scope="col" data-i18n="iap.col.subjects"></th>
              <th scope="col" data-i18n="iap.col.availableUntil"></th>
              <th scope="col" data-i18n="iap.col.published"></th>
              <th scope="col" data-i18n="iap.col.actions"></th>
            </tr>
          </thead>
          <tbody id="iap-body"></tbody>
        </table>
      </div>
      <div id="iap-purchases" class="iap-purchases" hidden>
        <div class="section-head">
          <h3 id="iap-purchases-title"></h3>
          <button id="iap-purchases-close" class="btn secondary small" type="button" data-i18n="iap.purchasesClose"></button>
        </div>
        <div id="iap-purchases-banner" class="banner" role="alert" hidden></div>
        <div class="table-wrap">
          <table id="iap-purchases-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="iap.pcol.date"></th>
                <th scope="col" data-i18n="iap.pcol.user"></th>
                <th scope="col" data-i18n="iap.pcol.transaction"></th>
                <th scope="col" data-i18n="iap.pcol.environment"></th>
                <th scope="col" data-i18n="iap.pcol.granted"></th>
              </tr>
            </thead>
            <tbody id="iap-purchases-body"></tbody>
          </table>
        </div>
      </div>
    </section>
    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="section-head">
        <div>
          <h2 data-i18n="settings.title"></h2>
          <p class="muted small" data-i18n="settings.subtitle"></p>
        </div>
      </div>
      <div id="settings-banner" class="banner" role="alert" hidden></div>
      <form id="settings-form" class="settings-form" novalidate>
        <div class="field-toggle">
          <label class="toggle-label" for="settings-show-prices">
            <input id="settings-show-prices" type="checkbox">
            <span data-i18n="settings.showPrices"></span>
          </label>
          <p class="muted small" data-i18n="settings.showPricesNote"></p>
        </div>

        <div class="field">
          <label for="settings-support-whatsapp" data-i18n="settings.whatsapp"></label>
          <input id="settings-support-whatsapp" type="text" dir="ltr" maxlength="15" autocomplete="off" data-i18n-placeholder="settings.whatsappHint">
          <span class="muted small" data-i18n="settings.whatsappHint"></span>
        </div>

        <h3 data-i18n="settings.centerSection"></h3>

        <div class="settings-grid">
          <div class="field">
            <label for="settings-center-name-ar" data-i18n="settings.centerNameAr"></label>
            <input id="settings-center-name-ar" type="text" maxlength="100" autocomplete="off">
          </div>
          <div class="field">
            <label for="settings-center-name-en" data-i18n="settings.centerNameEn"></label>
            <input id="settings-center-name-en" type="text" dir="ltr" maxlength="100" autocomplete="off">
          </div>
        </div>

        <div class="settings-grid">
          <div class="field">
            <label for="settings-center-address-ar" data-i18n="settings.centerAddressAr"></label>
            <textarea id="settings-center-address-ar" rows="3" maxlength="300"></textarea>
          </div>
          <div class="field">
            <label for="settings-center-address-en" data-i18n="settings.centerAddressEn"></label>
            <textarea id="settings-center-address-en" dir="ltr" rows="3" maxlength="300"></textarea>
          </div>
        </div>

        <div class="settings-grid">
          <div class="field">
            <label for="settings-center-hours-ar" data-i18n="settings.centerHoursAr"></label>
            <input id="settings-center-hours-ar" type="text" maxlength="200" autocomplete="off">
          </div>
          <div class="field">

    <section id="panel-files" role="tabpanel" aria-labelledby="tab-files" hidden>

          <label for="files-level" data-i18n="files.level"></label>
          <select id="files-level"></select>
        </div>

          <label for="files-subject" data-i18n="files.subject"></label>
          <select id="files-subject" disabled></select>
        </div>
      </div>

        <table id="files-table">

              <th scope="col" data-i18n="files.col.actions"></th>

      <form id="files-form" class="settings-form" novalidate>
        <h3 data-i18n="files.uploadTitle"></h3>
        <div class="settings-grid">
          <div class="field">
            <label for="files-kind" data-i18n="files.kind"></label>
            <select id="files-kind"></select>
          </div>
          <div class="field">
            <span id="files-file-label" class="field-label" data-i18n="files.file"></span>
            <!-- Drop zone: the native file input covers the whole zone (transparent),
                 so a click opens the picker and a dropped file lands in it. -->
            <div id="files-drop" class="dropzone" data-drag="off">
              <span class="dropzone-icon" aria-hidden="true">⇪</span>
              <span class="dropzone-title" data-i18n="files.dropTitle"></span>
              <span id="files-file-name" class="dropzone-name muted small"></span>
              <input id="files-file" class="dropzone-input" type="file" accept="application/pdf,.pdf" aria-labelledby="files-file-label" aria-describedby="files-file-name files-limit">
            </div>
            <span id="files-limit" class="muted small"></span>
          </div>
        </div>
        <div class="settings-grid">
          <div class="field">
            <label for="files-title-ar" data-i18n="files.titleAr"></label>
            <input id="files-title-ar" type="text" maxlength="200" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="files-title-en" data-i18n="files.titleEn"></label>
            <input id="files-title-en" type="text" dir="ltr" maxlength="200" autocomplete="off">
          </div>
        </div>
        <div id="files-form-banner" class="banner" role="alert" hidden></div>
        <div class="settings-actions">
          <button id="files-submit" class="btn primary" type="submit" data-i18n="files.upload"></button>
          <button id="files-cancel" class="btn secondary" type="button" data-i18n="files.cancelUpload" hidden></button>
          <span id="files-status" class="muted small" role="status"></span>
          <progress id="files-progress" class="upload-progress" data-i18n-aria-label="files.uploading" hidden></progress>
        </div>

    <section id="panel-notifications" role="tabpanel" aria-labelledby="tab-notifications" hidden>

      <form id="notifications-form" class="settings-form" novalidate>

        <div class="toolbar">
          <div class="field grow">
            <label for="notifications-level" data-i18n="notifications.level"></label>

          <div class="field grow">
            <label for="notifications-subject" data-i18n="notifications.subject"></label>

          <button id="notifications-submit" class="btn primary" type="submit" data-i18n="notifications.send"></button>
        </div>
      </form>
      <h3 data-i18n="notifications.history"></h3>
      <div class="table-wrap">
        <table id="notifications-table">

          <span data-role="info"></span>
          <button class="btn secondary small" type="button" data-role="next" data-i18n="common.next"></button>
        </div>
      </div>
